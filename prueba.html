<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Cronómetro de Entrenamiento</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #121212;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #ffffff;
    }

    .app-viewport {
      width: 100%;
      height: 100dvh; 
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-around;
      padding: calc(20px + env(safe-area-inset-top)) 20px calc(20px + env(safe-area-inset-bottom)) 20px;
      background-color: #121212;
    }

    .round-info { 
      font-size: clamp(1.8rem, 5vw, 3rem); 
      color: #a0a0a0; 
      font-weight: 600;
      text-align: center;
    }

    .step-info { 
      font-size: clamp(1.5rem, 4vw, 2.5rem); 
      color: #00e676; 
      font-weight: bold; 
      text-align: center;
    }

    .timer { 
      font-size: clamp(7rem, 25vw, 16rem); 
      font-weight: 800; 
      font-family: monospace; 
      line-height: 1;
      margin: 10px 0;
    }

    .controls { 
      display: flex; 
      gap: 15px; 
      justify-content: center; 
      width: 100%;
      max-width: 500px;
      margin-bottom: 20px;
    }

    button {
      flex: 1;
      padding: 18px 20px;
      font-size: 1.2rem;
      font-weight: bold;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      touch-action: manipulation;
    }

    .btn-start { background-color: #00e676; color: #121212; }
    .btn-pause { background-color: #ffb300; color: #121212; }
    .btn-reset { background-color: #ff5252; color: #ffffff; }

    :-webkit-full-screen { background-color: #121212; }
    :fullscreen { background-color: #121212; }
  </style>
</head>
<body>

<div class="app-viewport" id="appViewport">
  <div class="round-info" id="roundLabel">Ronda 1 / 3</div>
  <div class="step-info" id="stepLabel">Bloque: 60 seg</div>
  <div class="timer" id="timerDisplay">60</div>
  
  <div class="controls">
    <button class="btn-start" onclick="startTimer()">Iniciar</button>
    <button class="btn-pause" onclick="pauseTimer()">Pausar</button>
    <button class="btn-reset" onclick="resetTimer()">Reiniciar</button>
  </div>
</div>

<script>
  const rounds = 3;
  const sequence = [60, 45, 30, 15];
  
  let currentRound = 0;
  let currentStep = 0;
  let timeLeft = sequence[0];
  let timerInterval = null;
  let wakeLock = null;

  const timerDisplay = document.getElementById('timerDisplay');
  const roundLabel = document.getElementById('roundLabel');
  const stepLabel = document.getElementById('stepLabel');
  const appViewport = document.getElementById('appViewport');

  // Función para mantener la pantalla encendida
  async function requestWakeLock() {
    if ('wakeLock' in navigator) {
      try {
        wakeLock = await navigator.wakeLock.request('screen');
      } catch (err) {
        console.error(err);
      }
    }
  }

  function releaseWakeLock() {
    if (wakeLock !== null) {
      wakeLock.release().then(() => {
        wakeLock = null;
      });
    }
  }

  function enterFullscreen() {
    if (!document.fullscreenElement && !document.webkitFullscreenElement) {
      if (appViewport.requestFullscreen) {
        appViewport.requestFullscreen().catch(() => {});
      } else if (appViewport.webkitRequestFullscreen) {
        appViewport.webkitRequestFullscreen();
      }
    }
  }

  function updateDisplay() {
    timerDisplay.textContent = timeLeft;
    roundLabel.textContent = `Ronda ${currentRound + 1} / ${rounds}`;
    stepLabel.textContent = `Bloque: ${sequence[currentStep]} seg`;
  }

  async function startTimer() {
    if (timerInterval) return;

    // Activa pantalla completa y bloqueo de apagado a la vez
    enterFullscreen();
    await requestWakeLock();

    timerInterval = setInterval(() => {
      if (timeLeft > 0) {
        timeLeft--;
        timerDisplay.textContent = timeLeft;
      } else {
        advanceSequence();
      }
    }, 1000);
  }

  function advanceSequence() {
    currentStep++;
    if (currentStep >= sequence.length) {
      currentStep = 0;
      currentRound++;
    }

    if (currentRound >= rounds) {
      clearInterval(timerInterval);
      timerInterval = null;
      releaseWakeLock();
      timerDisplay.textContent = "FIN";
      roundLabel.textContent = "¡Completado!";
      stepLabel.textContent = "";
      return;
    }

    timeLeft = sequence[currentStep];
    updateDisplay();
  }

  function pauseTimer() {
    clearInterval(timerInterval);
    timerInterval = null;
    releaseWakeLock();
  }

  function resetTimer() {
    pauseTimer();
    currentRound = 0;
    currentStep = 0;
    timeLeft = sequence[0];
    updateDisplay();
  }

  // Re-activar si se minimiza y vuelve a abrir
  document.addEventListener('visibilitychange', async () => {
    if (wakeLock !== null && document.visibilityState === 'visible') {
      await requestWakeLock();
    }
  });

  updateDisplay();
</script>

</body>
</html>
