<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cronómetro por Rondas</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #121212;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .container {
      text-align: center;
      background: #1e1e1e;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      width: 90%;
      max-width: 400px;
    }
    .round-info { font-size: 1.4rem; color: #a0a0a0; margin-bottom: 10px; }
    .step-info { font-size: 1.2rem; color: #00e676; margin-bottom: 20px; font-weight: bold; }
    .timer { font-size: 6rem; font-weight: bold; font-family: monospace; margin: 20px 0; }
    .controls { display: flex; gap: 10px; justify-content: center; margin-top: 20px; flex-wrap: wrap; }
    button {
      padding: 12px 20px;
      font-size: 1rem;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    .btn-start { background-color: #00e676; color: #121212; }
    .btn-pause { background-color: #ffb300; color: #121212; }
    .btn-reset { background-color: #ff5252; color: #ffffff; }
    .btn-full { background-color: #2196F3; color: #ffffff; width: 100%; margin-top: 15px; }
  </style>
</head>
<body>

<div class="container" id="appContainer">
  <div class="round-info" id="roundLabel">Ronda 1 / 3</div>
  <div class="step-info" id="stepLabel">Bloque: 60 seg</div>
  <div class="timer" id="timerDisplay">60</div>
  
  <div class="controls">
    <button class="btn-start" onclick="startTimer()">Iniciar</button>
    <button class="btn-pause" onclick="pauseTimer()">Pausar</button>
    <button class="btn-reset" onclick="resetTimer()">Reiniciar</button>
  </div>
  <button class="btn-full" onclick="toggleFullScreen()">📺 Pantalla Completa</button>
</div>

<script>
  const rounds = 3;
  const sequence = [60, 45, 30, 15];
  
  let currentRound = 0;
  let currentStep = 0;
  let timeLeft = sequence[0];
  let timerInterval = null;

  const timerDisplay = document.getElementById('timerDisplay');
  const roundLabel = document.getElementById('roundLabel');
  const stepLabel = document.getElementById('stepLabel');
  const appContainer = document.getElementById('appContainer');

  function toggleFullScreen() {
    if (!document.fullscreenElement) {
      appContainer.requestFullscreen().catch(() => {});
    } else {
      document.exitFullscreen();
    }
  }

  function updateDisplay() {
    timerDisplay.textContent = timeLeft;
    roundLabel.textContent = `Ronda ${currentRound + 1} / ${rounds}`;
    stepLabel.textContent = `Bloque: ${sequence[currentStep]} seg`;
  }

  function startTimer() {
    if (timerInterval) return;

    if (!document.fullscreenElement) {
      appContainer.requestFullscreen().catch(() => {});
    }

    timerInterval = setInterval(() => {
      if (timeLeft > 0) {
        timeLeft--;
        timerDisplay.textContent = timeLeft;
      } else {
        advanceSequence();
      }
    }, 1000);
  }

  function advanceSequence() {
    currentStep++;
    if (currentStep >= sequence.length) {
      currentStep = 0;
      currentRound++;
    }

    if (currentRound >= rounds) {
      clearInterval(timerInterval);
      timerInterval = null;
      timerDisplay.textContent = "FIN";
      roundLabel.textContent = "¡Completado!";
      stepLabel.textContent = "";
      return;
    }

    timeLeft = sequence[currentStep];
    updateDisplay();
  }

  function pauseTimer() {
    clearInterval(timerInterval);
    timerInterval = null;
  }

  function resetTimer() {
    pauseTimer();
    currentRound = 0;
    currentStep = 0;
    timeLeft = sequence[0];
    updateDisplay();
  }

  updateDisplay();
</script>

</body>
</html>
