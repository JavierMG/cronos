<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Cronómetro de Entrenamiento</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #121212;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #ffffff;
    }

    .app-viewport {
      width: 100%;
      height: 100dvh; 
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-around;
      padding: calc(20px + env(safe-area-inset-top)) 20px calc(20px + env(safe-area-inset-bottom)) 20px;
      background-color: #121212;
    }

    .round-info { 
      font-size: clamp(1.8rem, 5vw, 3rem); 
      color: #a0a0a0; 
      font-weight: 600;
      text-align: center;
    }

    .step-info { 
      font-size: clamp(1.5rem, 4vw, 2.5rem); 
      color: #00e676; 
      font-weight: bold; 
      text-align: center;
    }

    .timer { 
      font-size: clamp(7rem, 25vw, 16rem); 
      font-weight: 800; 
      font-family: monospace; 
      line-height: 1;
      margin: 10px 0;
    }

    .controls { 
      display: flex; 
      gap: 15px; 
      justify-content: center; 
      width: 100%;
      max-width: 500px;
      margin-bottom: 20px;
    }

    button {
      flex: 1;
      padding: 18px 20px;
      font-size: 1.2rem;
      font-weight: bold;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      touch-action: manipulation;
    }

    .btn-start { background-color: #00e676; color: #121212; }
    .btn-pause { background-color: #ffb300; color: #121212; }
    .btn-reset { background-color: #ff5252; color: #ffffff; }

    :-webkit-full-screen { background-color: #121212; }
    :fullscreen { background-color: #121212; }
  </style>
</head>
<body>

<div class="app-viewport" id="appViewport">
  <div class="round-info" id="roundLabel">Preparación</div>
  <div class="step-info" id="stepLabel">Prepárate</div>
  <div class="timer" id="timerDisplay">10</div>
  
  <div class="controls">
    <button class="btn-start" onclick="startTimer()">Iniciar</button>
    <button class="btn-pause" onclick="pauseTimer()">Pausar</button>
    <button class="btn-reset" onclick="resetTimer()">Reiniciar</button>
  </div>
</div>

<script>
  const rounds = 3;
  const prepTime = 10;
  const sequence = [60, 45, 30, 15];
  
  let isPreparing = true;
  let currentRound = 0;
  let currentStep = 0;
  let timeLeft = prepTime;
  let timerInterval = null;
  let wakeLock = null;
  let audioCtx = null;

  const timerDisplay = document.getElementById('timerDisplay');
  const roundLabel = document.getElementById('roundLabel');
  const stepLabel = document.getElementById('stepLabel');
  const appViewport = document.getElementById('appViewport');

  function initAudio() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
  }

  // Generador de efecto campana (con resonancia metálica y desvanecimiento largo)
  function playBell(frequency = 587.33, duration = 1200) { // 587.33 Hz (Nota D5, sonido campana clásica)
    try {
      initAudio();
      const now = audioCtx.currentTime;

      // Usamos varios osciladores para simular los armónicos metálicos de una campana real
      const harmonics = [1, 2.02, 3.01]; 
      const gains = [0.4, 0.2, 0.1];

      harmonics.forEach((harmonic, index) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(frequency * harmonic, now);

        // Desvanecimiento lento (efecto resonancia de campana)
        gain.gain.setValueAtTime(gains[index], now);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + duration / 1000);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start(now);
        osc.stop(now + duration / 1000);
      });
    } catch (e) {
      console.error(e);
    }
  }

  function playTickSound() {
    playBell(440, 300); // Campana más suave para la cuenta atrás
  }

  function playChangeSound() {
    playBell(587.33, 1000); // Campana principal al cambiar de intervalo
  }

  function playStartSound() {
    playBell(659.25, 1200); // Campana de inicio de ronda
  }

  function playEndSound() {
    playBell(523.25, 1500); // Campana grave de finalización
    setTimeout(() => playBell(783.99, 2000), 300); // Doble campanazo final épico
  }

  async function requestWakeLock() {
    if ('wakeLock' in navigator) {
      try {
        wakeLock = await navigator.wakeLock.request('screen');
      } catch (err) {
        console.error(err);
      }
    }
  }

  function releaseWakeLock() {
    if (wakeLock !== null) {
      wakeLock.release().then(() => {
        wakeLock = null;
      });
    }
  }

  function enterFullscreen() {
    if (!document.fullscreenElement && !document.webkitFullscreenElement) {
      if (appViewport.requestFullscreen) {
        appViewport.requestFullscreen().catch(() => {});
      } else if (appViewport.webkitRequestFullscreen) {
        appViewport.webkitRequestFullscreen();
      }
    }
  }

  function updateDisplay() {
    timerDisplay.textContent = timeLeft;
    if (isPreparing) {
      roundLabel.textContent = "Preparación";
      stepLabel.textContent = "Prepárate";
    } else {
      roundLabel.textContent = `Ronda ${currentRound + 1} / ${rounds}`;
      stepLabel.textContent = `Bloque: ${sequence[currentStep]} seg`;
    }
  }

  async function startTimer() {
    if (timerInterval) return;

    enterFullscreen();
    await requestWakeLock();
    initAudio();

    timerInterval = setInterval(() => {
      if (timeLeft > 1) {
        timeLeft--;
        timerDisplay.textContent = timeLeft;
        if (isPreparing && timeLeft <= 3) {
          playTickSound();
        }
      } else {
        advanceSequence();
      }
    }, 1000);
  }

  function advanceSequence() {
    if (isPreparing) {
      isPreparing = false;
      timeLeft = sequence[0];
      currentStep = 0;
      currentRound = 0;
      playStartSound();
      updateDisplay();
      return;
    }

    currentStep++;
    if (currentStep >= sequence.length) {
      currentStep = 0;
      currentRound++;
    }

    if (currentRound >= rounds) {
      clearInterval(timerInterval);
      timerInterval = null;
      releaseWakeLock();
      playEndSound();
      timerDisplay.textContent = "FIN";
      roundLabel.textContent = "¡Completado!";
      stepLabel.textContent = "";
      return;
    }

    playChangeSound();
    timeLeft = sequence[currentStep];
    updateDisplay();
  }

  function pauseTimer() {
    clearInterval(timerInterval);
    timerInterval = null;
    releaseWakeLock();
  }

  function resetTimer() {
    pauseTimer();
    isPreparing = true;
    currentRound = 0;
    currentStep = 0;
    timeLeft = prepTime;
    updateDisplay();
  }

  document.addEventListener('visibilitychange', async () => {
    if (wakeLock !== null && document.visibilityState === 'visible') {
      await requestWakeLock();
    }
  });

  updateDisplay();
</script>

</body>
</html>
