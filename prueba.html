<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cronómetro de Entrenamiento</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #121212;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #ffffff;
    }

    /* Ocupa el 100% de la pantalla visible */
    .app-viewport {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-around;
      padding: 20px;
      background-color: #121212; /* Fondo uniforme */
    }

    .round-info { 
      font-size: clamp(1.8rem, 5vw, 3rem); 
      color: #a0a0a0; 
      font-weight: 600;
      text-align: center;
    }

    .step-info { 
      font-size: clamp(1.5rem, 4vw, 2.5rem); 
      color: #00e676; 
      font-weight: bold; 
      text-align: center;
    }

    /* Número gigante responsivo */
    .timer { 
      font-size: clamp(7rem, 25vw, 16rem); 
      font-weight: 800; 
      font-family: monospace; 
      line-height: 1;
      margin: 10px 0;
    }

    .controls { 
      display: flex; 
      gap: 15px; 
      justify-content: center; 
      width: 100%;
      max-width: 500px;
      margin-bottom: 20px;
    }

    button {
      flex: 1;
      padding: 18px 20px;
      font-size: 1.2rem;
      font-weight: bold;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      touch-action: manipulation;
      transition: background-color 0.2s;
    }

    .btn-start { background-color: #00e676; color: #121212; }
    .btn-start:active { background-color: #00c864; }

    .btn-pause { background-color: #ffb300; color: #121212; }
    .btn-pause:active { background-color: #e6a100; }

    .btn-reset { background-color: #ff5252; color: #ffffff; }
    .btn-reset:active { background-color: #d32f2f; }

    /* Estilos para el modo Pantalla Completa nativo */
    :fullscreen .app-viewport { background-color: #121212; padding: 40px 20px; }
    :-webkit-full-screen .app-viewport { background-color: #121212; padding: 40px 20px; }
    
    /* Pequeña ayuda visual inicial */
    #startHint {
      position: absolute;
      bottom: 20px;
      font-size: 0.9rem;
      color: #555;
      transition: opacity 0.5s;
    }
  </style>
</head>
<body>

<div class="app-viewport" id="appViewport">
  <div class="round-info" id="roundLabel">Ronda 1 / 3</div>
  <div class="step-info" id="stepLabel">Bloque: 60 seg</div>
  <div class="timer" id="timerDisplay">60</div>
  
  <div class="controls">
    <button class="btn-start" id="startBtn" onclick="startTimer()">Iniciar</button>
    <button class="btn-pause" onclick="pauseTimer()">Pausar</button>
    <button class="btn-reset" onclick="resetTimer()">Reiniciar</button>
  </div>
  
  <div id="startHint">Pulsa Iniciar para pantalla completa</div>
</div>

<script>
  const rounds = 3;
  const sequence = [60, 45, 30, 15];
  
  let currentRound = 0;
  let currentStep = 0;
  let timeLeft = sequence[0];
  let timerInterval = null;

  const timerDisplay = document.getElementById('timerDisplay');
  const roundLabel = document.getElementById('roundLabel');
  const stepLabel = document.getElementById('stepLabel');
  const appViewport = document.getElementById('appViewport');
  const startHint = document.getElementById('startHint');

  // Función para forzar pantalla completa nativa
  function enterFullscreen() {
    if (!document.fullscreenElement && !document.webkitFullscreenElement) {
      if (appViewport.requestFullscreen) {
        appViewport.requestFullscreen().catch(() => {});
      } else if (appViewport.webkitRequestFullscreen) { /* iOS / Safari */
        appViewport.webkitRequestFullscreen();
      }
    }
    // Ocultar la ayuda visual
    startHint.style.opacity = '0';
    setTimeout(() => startHint.style.display = 'none', 500);
  }

  function updateDisplay() {
    timerDisplay.textContent = timeLeft;
    roundLabel.textContent = `Ronda ${currentRound + 1} / ${rounds}`;
    stepLabel.textContent = `Bloque: ${sequence[currentStep]} seg`;
  }

  function startTimer() {
    if (timerInterval) return;

    // Activa pantalla completa AUTOMÁTICAMENTE al pulsar Iniciar
    enterFullscreen();

    timerInterval = setInterval(() => {
      if (timeLeft > 0) {
        timeLeft--;
        timerDisplay.textContent = timeLeft;
      } else {
        advanceSequence();
      }
    }, 1000);
  }

  function advanceSequence() {
    currentStep++;
    if (currentStep >= sequence.length) {
      currentStep = 0;
      currentRound++;
    }

    if (currentRound >= rounds) {
      clearInterval(timerInterval);
      timerInterval = null;
      timerDisplay.textContent = "FIN";
      roundLabel.textContent = "¡Completado!";
      stepLabel.textContent = "";
      return;
    }

    timeLeft = sequence[currentStep];
    updateDisplay();
  }

  function pauseTimer() {
    clearInterval(timerInterval);
    timerInterval = null;
  }

  function resetTimer() {
    pauseTimer();
    currentRound = 0;
    currentStep = 0;
    timeLeft = sequence[0];
    updateDisplay();
    // Reaparecer ayuda si se reinicia fuera de pantalla completa
    if (!document.fullscreenElement && !document.webkitFullscreenElement) {
      startHint.style.display = 'block';
      startHint.style.opacity = '1';
    }
  }

  // Detectar cambios en la visibilidad para pausar/reanudar Wake Lock si fuera necesario
  // Aunque con Fullscreen nativo el Wake Lock es automático en la mayoría de móviles.

  updateDisplay();
</script>

</body>
</html>
