<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cronómetro por Rondas</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #121212;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #ffffff;
    }

    /* Ocupa el 100% de la pantalla */
    .app-viewport {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-around;
      padding: 20px;
      background-color: #1e1e1e;
    }

    .round-info { 
      font-size: clamp(1.8rem, 5vw, 3rem); 
      color: #a0a0a0; 
      font-weight: 600;
    }

    .step-info { 
      font-size: clamp(1.5rem, 4vw, 2.5rem); 
      color: #00e676; 
      font-weight: bold; 
    }

    /* Número gigante responsivo para verlo a distancia */
    .timer { 
      font-size: clamp(7rem, 25vw, 15rem); 
      font-weight: 800; 
      font-family: monospace; 
      line-height: 1;
      margin: 10px 0;
    }

    .controls { 
      display: flex; 
      gap: 12px; 
      justify-content: center; 
      width: 100%;
      max-width: 500px;
      flex-wrap: wrap;
    }

    button {
      flex: 1;
      min-width: 100px;
      padding: 16px 20px;
      font-size: 1.1rem;
      font-weight: bold;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      touch-action: manipulation;
    }

    .btn-start { background-color: #00e676; color: #121212; }
    .btn-pause { background-color: #ffb300; color: #121212; }
    .btn-reset { background-color: #ff5252; color: #ffffff; }
    .btn-full { background-color: #2196F3; color: #ffffff; flex: 100%; }

    /* Ajuste visual cuando se activa el modo Pantalla Completa nativo */
    :-webkit-full-screen { width: 100%; height: 100%; }
    :-moz-full-screen { width: 100%; height: 100%; }
    :fullscreen { width: 100%; height: 100%; }
  </style>
</head>
<body>

<div class="app-viewport" id="appViewport">
  <div class="round-info" id="roundLabel">Ronda 1 / 3</div>
  <div class="step-info" id="stepLabel">Bloque: 60 seg</div>
  <div class="timer" id="timerDisplay">60</div>
  
  <div class="controls">
    <button class="btn-start" onclick="startTimer()">Iniciar</button>
    <button class="btn-pause" onclick="pauseTimer()">Pausar</button>
    <button class="btn-reset" onclick="resetTimer()">Reiniciar</button>
    <button class="btn-full" onclick="toggleFullScreen()">📺 Pantalla Completa</button>
  </div>
</div>

<script>
  const rounds = 3;
  const sequence = [60, 45, 30, 15];
  
  let currentRound = 0;
  let currentStep = 0;
  let timeLeft = sequence[0];
  let timerInterval = null;

  const timerDisplay = document.getElementById('timerDisplay');
  const roundLabel = document.getElementById('roundLabel');
  const stepLabel = document.getElementById('stepLabel');
  const appViewport = document.getElementById('appViewport');

  function requestFullscreen() {
    if (!document.fullscreenElement) {
      if (appViewport.requestFullscreen) {
        appViewport.requestFullscreen().catch(() => {});
      } else if (appViewport.webkitRequestFullscreen) { /* Safari / iOS */
        appViewport.webkitRequestFullscreen();
      }
    }
  }

  function toggleFullScreen() {
    if (!document.fullscreenElement && !document.webkitFullscreenElement) {
      requestFullscreen();
    } else {
      if (document.exitFullscreen) {
        document.exitFullscreen();
      } else if (document.webkitExitFullscreen) {
        document.webkitExitFullscreen();
      }
    }
  }

  function updateDisplay() {
    timerDisplay.textContent = timeLeft;
    roundLabel.textContent = `Ronda ${currentRound + 1} / ${rounds}`;
    stepLabel.textContent = `Bloque: ${sequence[currentStep]} seg`;
  }

  function startTimer() {
    if (timerInterval) return;

    requestFullscreen();

    timerInterval = setInterval(() => {
      if (timeLeft > 0) {
        timeLeft--;
        timerDisplay.textContent = timeLeft;
      } else {
        advanceSequence();
      }
    }, 1000);
  }

  function advanceSequence() {
    currentStep++;
    if (currentStep >= sequence.length) {
      currentStep = 0;
      currentRound++;
    }

    if (currentRound >= rounds) {
      clearInterval(timerInterval);
      timerInterval = null;
      timerDisplay.textContent = "FIN";
      roundLabel.textContent = "¡Completado!";
      stepLabel.textContent = "";
      return;
    }

    timeLeft = sequence[currentStep];
    updateDisplay();
  }

  function pauseTimer() {
    clearInterval(timerInterval);
    timerInterval = null;
  }

  function resetTimer() {
    pauseTimer();
    currentRound = 0;
    currentStep = 0;
    timeLeft = sequence[0];
    updateDisplay();
  }

  updateDisplay();
</script>

</body>
</html>
